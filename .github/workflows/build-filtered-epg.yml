name: Build filtered EPG

on:
  push:
    paths:
      - "epg/mappings.csv"
      - "tools/build_epg.py"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build channel files
        run: python tools/build_epg.py

      - name: Publish changed EPG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg/mappings.json epg/channels epg/source-channels
          git diff --cached --quiet || git commit -m "Update filtered EPG data"
          git push
